<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Website Pricing Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the website's configurator on the left; where the 3D viewer sits,
   a pricing panel that shows and edits the numbers behind the current pick. */
:root {
  /* One light, beige look in every theme. */
  --page: #ede6dc;
  --config: #f5efe7;
  --panel: #faf6f0;
  --ink: #1c1813;
  --muted: #7a6f62;
  --line: #ddd2c4;
  --edit: #b45f06;
  --edit-soft: #fbe9d2;
  --warn: #a3321e;
  --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--page); color: var(--ink); font: 15px/1.4 var(--sans); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 14px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); padding-block: 12px; margin-block: -12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.bar h1 { margin: 0; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.products { display: flex; flex-wrap: wrap; gap: 6px; }
.products button { border: 1px solid var(--line); background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.products button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.products .all { border-color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.products .all span { font-size: 12px; color: var(--muted); }

/* Right-hand drawer listing every product */
.scrim { position: fixed; inset: 0; background: rgba(28, 24, 19, 0.28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) 18px; gap: 14px; box-shadow: -12px 0 32px rgba(28, 24, 19, 0.12); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .22s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
.drawer header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drawer header h3 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.drawer header button { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.drawer input[type=search] { width: 100%; border: 1px solid var(--line); background: var(--config); color: var(--ink); font: 14px var(--sans); padding: 9px 11px; }
.drawer .list { overflow-y: auto; display: grid; gap: 16px; align-content: start; margin-inline: -6px; padding-inline: 6px; }
.drawer .grp { display: grid; gap: 2px; }
.drawer .grp small { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 8px 4px; }
.drawer .grp button { text-align: left; border: 0; background: none; padding: 7px 8px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.drawer .grp button:hover { background: var(--config); }
.drawer .grp button[aria-current="true"] { background: var(--ink); color: var(--panel); }
.drawer .grp button em { font-style: normal; font-size: 12px; color: var(--muted); }
.drawer .grp button[aria-current="true"] em { color: inherit; opacity: .7; }
.drawer .empty { color: var(--muted); font-size: 14px; padding: 8px; }

.stage { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 640px; border: 1px solid var(--line); }
@media (max-width: 880px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* Left: configurator */
.config { background: var(--config); padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.crumb { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.config h2 { margin: 0; font-size: 36px; font-weight: 400; letter-spacing: -0.04em; line-height: 1.1; }
.rows { border-top: 1px solid var(--ink); }
.row { border-bottom: 1px solid var(--ink); }
.row > button { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 11px 0; cursor: pointer; text-align: left; }
.row .chip { width: 24px; height: 24px; border-radius: 50%; flex: none; background: var(--line) center/cover; }
.row .chip:empty { display: none; }
.row .lab { display: grid; flex: 1; min-width: 0; }
.row .lab b { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; }
.row .lab span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { transition: transform .2s; font-size: 11px; }
.row.open .chev { transform: rotate(180deg); }
.body { padding: 2px 0 16px; display: grid; gap: 12px; }
.toggle { display: flex; gap: 6px; }
.toggle button, .textopt button { border: 1px solid var(--ink); background: transparent; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.toggle button[aria-pressed="true"], .textopt button[aria-pressed="true"] { background: var(--ink); color: var(--config); }
.textopt { display: flex; flex-wrap: wrap; gap: 8px; }
.fam { display: grid; gap: 6px; }
.fam small { font-size: 12px; color: var(--muted); }
.fam small .fp { font-weight: 500; color: var(--ink); margin-left: 6px; font-family: var(--mono); font-size: 11.5px; }
.line .cap { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); margin-top: -2px; }
.dots { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--line) center/cover; position: relative; }
.dot[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border: 1.5px solid var(--ink); border-radius: 50%; }
.dot.com { background: transparent; border: 1.5px solid var(--ink); font-weight: 600; }
.price { margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 18px; }
.price .amt { font-size: 30px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.price .amt.changed { color: var(--edit); }
.price small { font-size: 13px; }
.was { font-size: 13px; color: var(--muted); }

/* Right: pricing panel */
.pricing { background: var(--panel); padding: 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; border-left: 1px solid var(--line); }
/* Desktop: the pricing panel stays put while the fabric lists scroll past. */
@media (min-width: 881px) {
  .stage { align-items: start; }
  .config { min-height: 640px; }
  .pricing { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 60px)); max-height: calc(100vh - var(--bar-h, 60px)); overflow-y: auto; min-height: 640px; }
}
@media (max-width: 880px) { .pricing { border-left: 0; border-top: 1px solid var(--line); } }
.phead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.phead h3 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.lines { display: grid; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.line:first-child { padding-top: 4px; }
.line .t { font-size: 14px; font-weight: 600; }
.line .t span { font-weight: 400; color: var(--muted); }
.line .v { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.line .calc { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 13px var(--mono); color: var(--muted); }
.line .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--warn); }
.line .spec { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.line.skip .v, .line.skip .t { text-decoration: line-through; color: var(--muted); }
.field { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--config); }
.field i { font-style: normal; padding: 0 0 0 7px; color: var(--muted); font-size: 12px; }
.field em { font-style: normal; padding: 0 7px 0 0; color: var(--muted); font-size: 12px; }
.field input { width: 78px; border: 0; background: none; color: var(--ink); font: 500 13.5px var(--mono); text-align: right; padding: 5px 6px; font-variant-numeric: tabular-nums; }
.field input.sm { width: 64px; }
.field input:focus-visible { outline: none; }
.field:focus-within { border-color: var(--ink); }
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input[type=number] { -moz-appearance: textfield; }
.field.changed { border-color: var(--edit); background: var(--edit-soft); }
.field.changed input { color: var(--edit); }
.total { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; font-size: 14px; padding-top: 4px; }
.total .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.total .big { font-weight: 600; font-size: 16px; }
.foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.foot .acts { display: flex; gap: 8px; }
.foot button { border: 1px solid var(--line); background: none; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.foot button:hover { border-color: var(--ink); }
.legend i { display: inline-block; width: 9px; height: 9px; background: var(--edit); margin-right: 6px; }
textarea { width: 100%; min-height: 110px; font: 12px var(--mono); background: var(--config); color: var(--ink); border: 1px solid var(--line); padding: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 8px 14px; font-size: 13px; }
</style>
<style>body{margin:0}</style>

<div class="wrap">
  <div class="bar">
    <h1>Pricing Simulator</h1>
    <div class="products" id="products"></div>
  </div>
  <div class="stage">
    <section class="config" aria-label="Configurator">
      <div class="crumb" id="crumb"></div>
      <h2 id="name"></h2>
      <div class="rows" id="rows"></div>
      <div class="price"><div><div class="amt" id="amt"></div><div class="was" id="was"></div></div><small>Ex. VAT + Shipping</small></div>
    </section>
    <section class="pricing" aria-labelledby="ph">
      <div class="phead"><h3 id="ph">How this price is made</h3><div class="seg" id="cur" role="group" aria-label="Currency"></div></div>
      <div class="lines" id="lines"></div>
      <div class="total" id="total"></div>
      <div class="foot">
        <span class="legend"><i></i>Changed from the live site. Changes stay in this browser only.</span>
        <span class="acts"><button type="button" id="copy">Copy changes</button><button type="button" id="reset">Reset</button></span>
      </div>
      <textarea id="copytext" readonly hidden aria-label="Your changes"></textarea>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dh" role="dialog">
  <header><h3 id="dh">All furniture</h3><button type="button" id="dclose" aria-label="Close">×</button></header>
  <input type="search" id="dsearch" placeholder="Search products" aria-label="Search products" autocomplete="off">
  <div class="list" id="dlist"></div>
</aside>

const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ data, settings, ui })); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shown = (c, cur = ui.cur) => SYM[cur] + Math.ceil(c / 100).toLocaleString('en-GB');
const exact = (c, cur = ui.cur) => SYM[cur] + (c / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const k = p.split('.'); const last = k.pop(); k.reduce((a, x) => a[x], o)[last] = v; };

const P = () => data.products[ui.product];
const sel = () => (ui.sel[P().handle] = ui.sel[P().handle] || { ...P().initial });
const isCustom = v => typeof v === 'string' && v.startsWith('custom-');
const swatchOf = (step, key) => {
  for (const [ti, t] of step.types.entries()) {
    const sw = data.swatches[t.key][key];
    if (sw && t.families.includes(sw.family)) return { t, ti, sw, fam: data.families[t.key][sw.family] };
  }
  return null;
};
const sizeStepIndex = p => p.steps.findIndex(s => p.handle === 'rua-ipanema' ? s.key === 'BASE' : s.key.toLowerCase() === 'size');

// A port of the website's price calculation (src/utilities/calculate.js).
// Each line carries the fields that feed it, so the panel can edit them in place.
function price(pi, S, cur) {
  const p = data.products[pi], m = MULT[cur], pct = settings.pct / 100, lines = [];
  const F = (path, o = {}) => ({ path, ...o });
  const priced = path => (getPath(LIVE, path) || 0) > 0 || (getPath(data, path) || 0) > 0;
  const pctField = F('settings.pct', { suffix: '%', small: 1 });
  let base;
  const zi = sizeStepIndex(p);
  const sizeOpt = zi > -1 ? (p.steps[zi].options.find(o => o.key === S[p.steps[zi].key]) || p.steps[zi].options[0]) : null;
  const sizeOi = sizeOpt ? p.steps[zi].options.indexOf(sizeOpt) : -1;

  if (p.mode === 'fixed') {
    // Fixed configurators: a priced option replaces the base; nothing is added on top.
    for (const [si, st] of p.steps.entries()) {
      if (st.kind !== 'options') continue;
      const oi = st.options.findIndex(o => o.key === S[st.key]);
      if (oi > -1 && st.options[oi].has) {
        base = st.options[oi].price * m;
        lines.push({ t: 'Price', sub: `${st.title} · ${st.options[oi].title}`, v: base, calc: [F(`products.${pi}.steps.${si}.options.${oi}.price`, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null] });
        return { base, opts: 0, total: base, lines };
      }
    }
    base = p.base * m;
    lines.push({ t: 'Price', v: base, calc: [F(`products.${pi}.base`, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null] });
    return { base, opts: 0, total: base, lines };
  }

  if (p.handle === 'rua-ipanema') {
    base = sizeOpt.price * m;
    lines.push({ t: 'Base price', sub: sizeOpt.title, v: base, calc: [F(`products.${pi}.steps.${zi}.options.${sizeOi}.price`, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null] });
  } else if (p.base) {
    base = p.base * m;
    lines.push({ t: 'Base price', v: base, calc: [F(`products.${pi}.base`, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null] });
  } else base = 0;

  let opts = 0;
  const comParts = COM_ALL[p.handle] || [];
  const custParts = comParts.filter(k => isCustom(S[k]));
  if (custParts.length > 0) {
    opts = base * pct;
    lines.push({ t: "Client's own material", sub: custParts.length === comParts.length ? 'all parts' : `${custParts.length} of ${comParts.length} parts`, v: opts, calc: [pctField, `of base ${exact(base)}`] });
  }

  p.steps.forEach((s, si) => {
    if (s.kind === 'backrest') {
      const ti = s.type.options.findIndex(o => o.key === S[s.type.key]);
      if (ti < 0) return;
      const o = s.type.options[ti];
      const leather = S[s.type.key] === 'LEATHER BACK';
      const li = leather ? s.leather.options.findIndex(x => x.key === S[s.leather.key]) : -1;
      const tp = `products.${pi}.steps.${si}.type.options.${ti}.price`, lp = li > -1 ? `products.${pi}.steps.${si}.leather.options.${li}.price` : null;
      let v = 0;
      const calc = [];
      if (priced(tp)) { v += (o.price || 0) * m; calc.push(F(tp, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null); }
      if (lp && priced(lp)) { v += (s.leather.options[li].price || 0) * m; calc.push(calc.length ? '+' : null, F(lp, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null); }
      if (!calc.length) return; // no price on this choice
      opts += v;
      lines.push({ t: s.title, sub: o.title + (li > -1 ? ` · ${s.leather.options[li].title}` : ''), v, calc });
      return;
    }
    if (s.kind === 'options') {
      const oi = s.options.findIndex(o => o.key === S[s.key]);
      if (oi < 0) return;
      const o = s.options[oi];
      if (p.handle === 'rua-ipanema' && s.key === 'BASE') return; // shown as the base
      if (s.key === 'size' || s.key === 'UPHOLSTERY TYPE') {
        // The site never charges this step; only its COM / COL can matter.
        if (o.req && (o.req.fabric != null || o.req.leather != null)) lines.push({ t: s.title, sub: `${o.title} · not charged`, v: 0, spec: ['Size', F(`products.${pi}.steps.${si}.options.${oi}.req.fabric`, { pre: 'COM', suffix: 'm', small: 1, blank: 1 }), F(`products.${pi}.steps.${si}.options.${oi}.req.leather`, { pre: 'COL', suffix: 'm²', small: 1, blank: 1 })] });
        return;
      }
      if (!priced(`products.${pi}.steps.${si}.options.${oi}.price`)) return; // no price on this choice
      const v = o.price * m;
      opts += v;
      const line = { t: s.title, sub: o.title, v, calc: [F(`products.${pi}.steps.${si}.options.${oi}.price`, { money: 1, eur: 1 }), m !== 1 ? `× ${m}` : null] };
      if (o.req && (o.req.fabric != null || o.req.leather != null)) {
        line.spec = ['Size', F(`products.${pi}.steps.${si}.options.${oi}.req.fabric`, { pre: 'COM', suffix: 'm', small: 1, blank: 1 }), F(`products.${pi}.steps.${si}.options.${oi}.req.leather`, { pre: 'COL', suffix: 'm²', small: 1, blank: 1 })];
      }
      lines.push(line);
      return;
    }
    // Upholstery
    const v0 = S[s.key];
    if (!v0) return;
    if (isCustom(v0)) {
      if (comParts.includes(s.key)) return; // charged once, above
      const kind = v0 === 'custom-leather' ? 'leather' : 'fabric';
      if (p.handle === 'park-place-stool') {
        const fi = p.steps.findIndex(x => x.key.toLowerCase() === 'finish');
        const fo = fi > -1 ? p.steps[fi].options.find(o => o.key === S[p.steps[fi].key]) : null;
        const v = fo ? fo.price * pct : 0; // the site doesn't convert this one
        opts = v;
        lines.push({ t: s.title, sub: `Client's own ${kind}`, v, calc: [pctField, `of the finish price ${exact(fo ? fo.price : 0, 'eur')}`], note: cur !== 'eur' ? `The site doesn't convert this to ${cur.toUpperCase()}.` : null });
        return;
      }
      if (base === 0 && zi > -1) {
        const v = sizeOpt.price * pct; // the site doesn't convert this one
        opts = v;
        lines.push({ t: s.title, sub: `Client's own ${kind}`, v, calc: [pctField, `of size price ${exact(sizeOpt.price, 'eur')}`], note: cur !== 'eur' ? `The site doesn't convert this to ${cur.toUpperCase()}.` : null });
        return;
      }
      opts += base * pct;
      lines.push({ t: s.title, sub: `Client's own ${kind}`, v: base * pct, calc: [pctField, `of base ${exact(base)}`] });
      return;
    }
    const f = swatchOf(s, v0);
    if (!f) return;
    const k = f.t.key, per = f.sw[cur];
    const swField = F(`swatches.${k}.${v0}.${cur}`, { money: 1, cur, suffix: `/${UNIT[k]}` });
    const reqField = F(`products.${pi}.steps.${si}.types.${f.ti}.requirement`, { pre: k === 'fabric' ? 'COM' : 'COL', suffix: UNIT[k], small: 1, blank: 1 });
    let req = f.t.requirement, from = 'step';
    if (!req) { req = sizeOpt && sizeOpt.req ? sizeOpt.req[k] : null; from = 'size'; }
    const v = (per || 0) * (req || 0);
    opts += v;
    const line = { t: s.title, sub: `${f.fam.title} ${f.sw.title}`, v, calc: [reqField, '×', swField], cap: `${k === 'fabric' ? 'COM' : 'COL'} × ${f.fam.title} ${f.sw.title} price per ${UNIT[k]}` };
    if (from === 'size') line.note = `No amount on this part, so the size's ${k === 'fabric' ? 'COM' : 'COL'} (${req ?? 'none'} ${UNIT[k]}) is used.`;
    else if (zi > -1 && sizeOpt.req && sizeOpt.req[k] != null && sizeOpt.req[k] !== req) line.note = `The ${req} ${UNIT[k]} on this part wins over the size's ${k === 'fabric' ? 'COM' : 'COL'} of ${sizeOpt.req[k]} ${UNIT[k]}. Clear it to use the size's amount.`;
    lines.push(line);
  });

  return { base, opts, total: base + opts, lines };
}

// ---------- Left: configurator ----------
function renderProducts() {
  const pills = data.products.map((p, i) => [p, i]).filter(([p, i]) => p.highlight || i === ui.product);
  const others = data.products.length - data.products.filter(p => p.highlight).length;
  $('products').innerHTML = pills.map(([p, i]) => `<button type="button" data-p="${i}" aria-pressed="${i === ui.product}">${esc(p.name)}</button>`).join('') + `<button type="button" class="all" id="dopen" aria-haspopup="dialog">All furniture <span>${others}</span></button>`;
  $('cur').innerHTML = ['eur', 'usd', 'cad'].map(c => `<button type="button" data-cur="${c}" aria-pressed="${ui.cur === c}">${c.toUpperCase()}</button>`).join('');
}

function current(s, S) {
  if (s.kind === 'options') { const o = s.options.find(x => x.key === S[s.key]); return { text: o?.title, img: o && IMG[`opt:${s.key}:${o.key}`] }; }
  if (s.kind === 'backrest') {
    const o = s.type.options.find(x => x.key === S[s.type.key]);
    if (S[s.type.key] === 'LEATHER BACK') { const l = s.leather.options.find(x => x.key === S[s.leather.key]); return { text: `${o?.title} · ${l?.title}`, img: l && IMG[`opt:${s.leather.key}:${l.key}`] }; }
    return { text: o?.title };
  }
  const v = S[s.key];
  if (isCustom(v)) return { text: `Client's own ${v.slice(7)}` };
  const f = swatchOf(s, v);
  return { text: f ? `${f.fam.title} - ${f.sw.title}` : '', img: IMG['sw:' + v] };
}

function renderConfig() {
  const p = P(), S = sel();
  $('crumb').textContent = 'Configure';
  $('name').textContent = p.name;
  $('rows').innerHTML = p.steps.map((s, si) => {
    const c = current(s, S), open = ui.open === si;
    let body = '';
    if (open) {
      if (s.kind === 'options') {
        const hasImg = s.options.some(o => IMG[`opt:${s.key}:${o.key}`]);
        body = hasImg
          ? `<div class="dots">${s.options.map(o => `<button type="button" class="dot" title="${esc(o.title)}" aria-label="${esc(o.title)}" aria-pressed="${S[s.key] === o.key}" data-set="${esc(s.key)}" data-val="${esc(o.key)}" style="background-image:url(${IMG[`opt:${s.key}:${o.key}`]})"></button>`).join('')}</div>`
          : `<div class="textopt">${s.options.map(o => `<button type="button" aria-pressed="${S[s.key] === o.key}" data-set="${esc(s.key)}" data-val="${esc(o.key)}">${esc(o.title)}</button>`).join('')}</div>`;
      } else if (s.kind === 'backrest') {
        body = `<div class="textopt">${s.type.options.map(o => `<button type="button" aria-pressed="${S[s.type.key] === o.key}" data-set="${esc(s.type.key)}" data-val="${esc(o.key)}">${esc(o.title)}</button>`).join('')}</div>`;
        if (S[s.type.key] === 'LEATHER BACK') body += `<div class="dots">${s.leather.options.map(o => `<button type="button" class="dot" title="${esc(o.title)}" aria-label="${esc(o.title)}" aria-pressed="${S[s.leather.key] === o.key}" data-set="${esc(s.leather.key)}" data-val="${esc(o.key)}" style="background-image:url(${IMG[`opt:${s.leather.key}:${o.key}`]})"></button>`).join('')}</div>`;
      } else {
        const v = S[s.key];
        const kind = isCustom(v) ? v.slice(7) : (swatchOf(s, v)?.t.key || 'fabric');
        const t = s.types.find(x => x.key === kind);
        body = `<div class="toggle">${s.types.map(x => `<button type="button" aria-pressed="${x.key === kind}" data-kind="${esc(s.key)}" data-val="${x.key}">${x.key === 'fabric' ? 'Fabric' : 'Leather'}</button>`).join('')}</div>`;
        body += t.families.map(fk => {
          const fam = data.families[t.key][fk];
          const ps = fam.swatches.map(k => data.swatches[t.key][k][ui.cur] / 100), lo = Math.min(...ps), hi = Math.max(...ps);
          const fp = `${SYM[ui.cur]}${lo.toLocaleString('en-GB')}${hi !== lo ? `–${hi.toLocaleString('en-GB')}` : ''}/${UNIT[t.key]}`;
          return `<div class="fam"><small>${esc(fam.title)} <b class="fp">${fp}</b></small><div class="dots">${fam.swatches.map(k => `<button type="button" class="dot" title="${esc(fam.title)} ${esc(data.swatches[t.key][k].title)}" aria-label="${esc(fam.title)} ${esc(data.swatches[t.key][k].title)}" aria-pressed="${v === k}" data-set="${esc(s.key)}" data-val="${esc(k)}" style="background-image:url(${IMG['sw:' + k] || ''})"></button>`).join('')}</div></div>`;
        }).join('');
        if (t.custom) body += `<div class="fam"><small>Client's own ${t.key}</small><div class="dots"><button type="button" class="dot com" aria-label="Client's own ${t.key}" title="Client's own ${t.key}" aria-pressed="${v === 'custom-' + t.key}" data-set="${esc(s.key)}" data-val="custom-${t.key}">?</button></div></div>`;
      }
    }
    return `<div class="row${open ? ' open' : ''}"><button type="button" data-open="${si}" aria-expanded="${open}"><span class="chip" ${c.img ? `style="background-image:url(${c.img})"` : ''}>${c.img ? ' ' : ''}</span><span class="lab"><b>${esc(s.title)}</b><span>${esc(c.text)}</span></span><span class="chev" aria-hidden="true">▼</span></button>${open ? `<div class="body">${body}</div>` : ''}</div>`;
  }).join('');
}

// ---------- Right: pricing panel ----------
function field(f) {
  const raw = f.path === 'settings.pct' ? settings.pct : getPath(data, f.path);
  const live = f.path === 'settings.pct' ? SETTINGS_LIVE.pct : getPath(LIVE, f.path);
  const val = raw == null ? '' : (f.money ? raw / 100 : raw);
  const changed = (raw ?? null) !== (live ?? null);
  const pre = f.pre || (f.money ? (f.eur ? '€' : SYM[f.cur]) : '');
  return `<label class="field${changed ? ' changed' : ''}">${pre ? `<i>${pre}</i>` : ''}<input type="number" min="0" step="${f.money ? '0.01' : '0.05'}" class="${f.small ? 'sm' : ''}" data-path="${esc(f.path)}" data-money="${f.money ? 1 : 0}" ${f.blank ? 'data-blank="1" placeholder="–"' : ''} value="${val}">${f.suffix ? `<em>${esc(f.suffix)}</em>` : ''}</label>`;
}
const calcHtml = parts => parts.filter(x => x != null).map(x => typeof x === 'string' ? `<span>${esc(x)}</span>` : field(x)).join('');

function renderPanel() {
  const S = sel();
  const r = price(ui.product, S, ui.cur);
  $('lines').innerHTML = r.lines.map((l, i) => `<div class="line${l.skip ? ' skip' : ''}" data-line="${i}"><span class="t">${esc(l.t)} <span>${esc(l.sub || '')}</span></span><span class="v">${exact(l.v)}</span>${l.calc ? `<span class="calc">${calcHtml(l.calc)}</span>` : ''}${l.cap ? `<span class="cap">${esc(l.cap)}</span>` : ''}${l.spec ? `<span class="spec">${calcHtml(l.spec)}</span>` : ''}${l.note ? `<span class="note">${esc(l.note)}</span>` : ''}</div>`).join('');
  renderTotals(r);
}

function renderTotals(r) {
  r = r || price(ui.product, sel(), ui.cur);
  r.lines.forEach((l, i) => { const el = document.querySelector(`[data-line="${i}"] .v`); if (el) el.textContent = exact(l.v); });
  $('total').innerHTML = `<span>Exact</span><span class="v">${exact(r.total)}</span><span class="big">Website shows (rounded up)</span><span class="v big">${shown(r.total)}</span>`;
  $('amt').textContent = shown(r.total);
  const liveData = data; data = LIVE; const liveSettings = settings; settings = SETTINGS_LIVE;
  const live = price(ui.product, sel(), ui.cur);
  data = liveData; settings = liveSettings;
  const diff = Math.ceil(live.total / 100) !== Math.ceil(r.total / 100);
  $('amt').classList.toggle('changed', diff);
  $('was').textContent = diff ? `Live site: ${shown(live.total)}` : '';
}

function renderAll() { renderProducts(); renderConfig(); renderPanel(); }

// ---------- Drawer ----------
function renderDrawer() {
  const q = $('dsearch').value.trim().toLowerCase();
  const list = data.products.map((p, i) => [p, i])
    .filter(([p]) => !p.highlight && (!q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)))
    .sort(([a], [b]) => a.name.localeCompare(b.name));
  $('dlist').innerHTML = list.length ? `<div class="grp">${list.map(([p, i]) => `<button type="button" data-pick="${i}" aria-current="${i === ui.product}">${esc(p.name)}<em>${p.mode === 'fixed' ? 'fixed price' : esc(p.category)}</em></button>`).join('')}</div>` : '<p class="empty">No products match.</p>';
}
function openDrawer() { $('drawer').hidden = false; $('scrim').hidden = false; $('dsearch').value = ''; renderDrawer(); $('dsearch').focus(); }
function closeDrawer() { $('drawer').hidden = true; $('scrim').hidden = true; $('dopen')?.focus(); }
$('dsearch').addEventListener('input', renderDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

// ---------- Events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const S = sel();
  if (b.id === 'dopen') return openDrawer();
  if (b.id === 'dclose') return closeDrawer();
  if (b.dataset.pick) { ui.product = +b.dataset.pick; ui.open = null; $('drawer').hidden = true; $('scrim').hidden = true; }
  else if (b.dataset.p) { ui.product = +b.dataset.p; ui.open = null; }
  else if (b.dataset.cur) ui.cur = b.dataset.cur; // also re-labels the family prices
  else if (b.dataset.open) ui.open = ui.open === +b.dataset.open ? null : +b.dataset.open;
  else if (b.dataset.set) S[b.dataset.set] = b.dataset.val;
  else if (b.dataset.kind) {
    const s = P().steps.find(x => x.key === b.dataset.kind);
    const t = s.types.find(x => x.key === b.dataset.val);
    const v = S[s.key];
    const now = isCustom(v) ? v.slice(7) : swatchOf(s, v)?.t.key;
    if (now !== t.key) S[s.key] = data.families[t.key][t.families[0]].swatches[0];
  }
  else if (b.id === 'reset') {
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Click again to reset'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Reset'; }, 3000); return; }
    data = clone(LIVE); settings = { ...SETTINGS_LIVE }; delete b.dataset.armed; b.textContent = 'Reset'; toast('Back to the live numbers');
  }
  else if (b.id === 'copy') return copyChanges();
  else return;
  save(); renderAll();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset.path) return;
  let v = t.value === '' ? (t.dataset.blank ? null : 0) : Number(t.value);
  if (v != null && t.dataset.money === '1') v = Math.round(v * 100);
  if (t.dataset.path === 'settings.pct') settings.pct = v ?? 0; else setPath(data, t.dataset.path, v);
  const live = t.dataset.path === 'settings.pct' ? SETTINGS_LIVE.pct : getPath(LIVE, t.dataset.path);
  t.closest('.field').classList.toggle('changed', (v ?? null) !== (live ?? null));
  save(); renderTotals();
});
// Re-draw once a number is done, so notes and crossed-out lines catch up.
document.addEventListener('change', e => { if (e.target.dataset.path) { renderConfig(); renderPanel(); } });

function changes() {
  const out = [], eu = c => c == null ? 'empty' : '€' + (c / 100).toFixed(2);
  data.products.forEach((p, i) => {
    const L = LIVE.products[i];
    if (p.base !== L.base) out.push(`${p.name} · Base price: ${eu(L.base)} → ${eu(p.base)}`);
    p.steps.forEach((s, si) => {
      const ls = L.steps[si];
      if (s.kind === 'options') s.options.forEach((o, oi) => {
        const lo = ls.options[oi];
        if (o.price !== lo.price) out.push(`${p.name} · ${s.title} ${o.title}: ${eu(lo.price)} → ${eu(o.price)}`);
        ['fabric', 'leather'].forEach(k => { if ((o.req[k] ?? null) !== (lo.req[k] ?? null)) out.push(`${p.name} · ${o.title} ${k === 'fabric' ? 'COM' : 'COL'}: ${lo.req[k] ?? 'empty'} → ${o.req[k] ?? 'empty'} ${UNIT[k]}`); });
      });
      if (s.kind === 'backrest') {
        s.type.options.forEach((o, oi) => { if (o.price !== ls.type.options[oi].price) out.push(`${p.name} · ${s.title} ${o.title}: ${eu(ls.type.options[oi].price)} → ${eu(o.price)}`); });
        s.leather.options.forEach((o, oi) => { if (o.price !== ls.leather.options[oi].price) out.push(`${p.name} · ${s.leather.title} ${o.title}: ${eu(ls.leather.options[oi].price)} → ${eu(o.price)}`); });
      }
      if (s.kind === 'upholstery') s.types.forEach((t, ti) => {
        const lt = ls.types[ti];
        if ((t.requirement ?? null) !== (lt.requirement ?? null)) out.push(`${p.name} · ${s.title} ${t.key} amount: ${lt.requirement ?? 'empty'} → ${t.requirement ?? 'empty'} ${UNIT[t.key]}`);
      });
    });
  });
  ['fabric', 'leather'].forEach(k => Object.entries(data.swatches[k]).forEach(([key, s]) => {
    const l = LIVE.swatches[k][key];
    const d = ['eur', 'usd', 'cad'].filter(c => s[c] !== l[c]);
    if (d.length) out.push(`${data.families[k][s.family].title} ${s.title} (${key}) per ${UNIT[k]}: ${d.map(c => `${c.toUpperCase()} ${(l[c] / 100).toFixed(2)} → ${(s[c] / 100).toFixed(2)}`).join(', ')}`);
  }));
  if (settings.pct !== SETTINGS_LIVE.pct) out.push(`Client's own material: ${SETTINGS_LIVE.pct}% → ${settings.pct}%`);
  return out;
}

function copyChanges() {
  const list = changes();
  const text = list.length ? `Pricing changes from the simulator:\n${list.map(l => '• ' + l).join('\n')}` : 'No changes from the live numbers.';
  const ta = $('copytext');
  ta.value = text; ta.hidden = false;
  try { navigator.clipboard.writeText(text).then(() => toast(list.length ? `Copied ${list.length} change${list.length > 1 ? 's' : ''}` : 'Nothing changed yet'), () => { ta.select(); toast('Select the text to copy it'); }); }
  catch (err) { ta.select(); }
}

let tt;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2000); }

// The pricing panel sticks just under the top bar, whatever its height.
const bar = document.querySelector('.bar');
const setBar = () => document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
try { new ResizeObserver(setBar).observe(bar); } catch (e) {}
setBar();

renderAll();
</script>

</body>
